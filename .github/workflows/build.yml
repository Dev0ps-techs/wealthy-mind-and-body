# Rebuilds the website automatically whenever content, photos or code change on GitHub.
name: Auto-build site
on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/build.mjs
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "Auto-build site" && git push)
